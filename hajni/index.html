<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hajni // 25</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#13241a; --card:#1b3324cc; --cream:#f3ecd2; --mustard:#e9c46a; --rust:#e76f51; --lime:#a7c957; --moss:#5b8c3e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--cream); font-family: 'Space Mono', ui-monospace, Menlo, Consolas, monospace; overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: -60%; z-index: 0; pointer-events: none;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(167,201,87,.09) 0deg 9deg, rgba(233,196,106,.06) 9deg 18deg, rgba(19,36,26,0) 18deg 27deg);
    animation: spin 90s linear infinite; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, rgba(233,196,106,.10), transparent 60%), radial-gradient(ellipse at 50% 110%, rgba(91,140,62,.35), transparent 55%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { margin: 0; text-align: center; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: clamp(18px, 5.4vw, 26px); letter-spacing: 1px; color: var(--mustard); }
  .name { display: block; font-family: 'Silkscreen', monospace; font-weight: 700; font-size: clamp(64px, 21vw, 116px); line-height: 1; margin: 6px 0 4px;
    background: linear-gradient(90deg, var(--lime), var(--mustard), var(--rust), var(--mustard), var(--lime)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 9s linear infinite;
    filter: drop-shadow(4px 4px 0 #0b1610); }
  @keyframes flow { to { background-position: 300% 0; } }
  .sub { text-align: center; color: var(--lime); font-size: 15px; margin: 0 0 12px; letter-spacing: .5px; }
  .art { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 14px; border: 2px solid #2f5235; }
  .card { background: var(--card); border: 2px solid #3d6a40; border-radius: 14px; padding: 16px 18px; margin-top: 16px; backdrop-filter: blur(2px); }
  .card h2 { margin: 0 0 12px; font-family: 'Silkscreen', monospace; font-weight: 400; font-size: 18px; color: var(--mustard); letter-spacing: 1px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 0; font-size: 15px; }
  dt { color: var(--lime); } dd { margin: 0; }
  .ok { color: var(--lime); }
  .rx { font-size: 15px; line-height: 1.65; }
  .rx b { font-family: 'Silkscreen', monospace; font-size: 34px; display: block; line-height: 1; margin-bottom: 6px; color: var(--cream); }
  .stamp { display: inline-block; margin-top: 12px; border: 3px solid var(--rust); color: var(--rust); border-radius: 8px; padding: 2px 12px;
    transform: rotate(-5deg); font-family: 'Silkscreen', monospace; letter-spacing: 1px; }
  footer { text-align: center; margin-top: 28px; font-family: 'Silkscreen', monospace; font-size: 22px; color: var(--mustard); }
  footer small { display: block; font-family: 'Space Mono', monospace; font-size: 13px; color: #9fb79a; margin-top: 6px; }
  .leaf { position: fixed; top: -30px; z-index: 0; pointer-events: none; animation: drift linear infinite; opacity: .8; }
  @keyframes drift { 0% { transform: translate(-10vw, 0) rotate(0deg); } 100% { transform: translate(60vw, 115vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { body::before, .name, .leaf { animation: none; } .leaf { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Boldog 25. születésnapot,</h1>
  <span class="name" style="text-align:center">HAJNI</span>
  <p class="sub">25 kör a Nap körül.</p>

  <picture>
    <source srcset="buli.webp" type="image/webp">
    <img class="art" src="buli.png" alt="Pixel-art kerti buli: kapszula-figura, macska, szív és levél a hegyek alatt" width="600" height="352">
  </picture>

  <div class="card rx">
    <b>Rp.</b>
    Szilvapálinka 0,5 L<br>
    S.: lassan, jó társaságban, szabad ég alatt<br>
    Főzte: Finna László<br>
    Ajándékozó: Daróczi Balázs<br>
    <span class="stamp">EGÉSZSÉGEDRE!</span>
  </div>

  <footer>Szeretettel: Balázs<small>2026.10.24.</small></footer>
</main>
<script>
  for (let i = 0; i < 9; i++) {
    const s = document.createElement("span");
    s.className = "leaf";
    s.textContent = "🍃";
    s.style.left = (Math.random() * 90 - 10) + "vw";
    s.style.fontSize = (14 + Math.random() * 14) + "px";
    s.style.animationDuration = (11 + Math.random() * 10) + "s";
    s.style.animationDelay = (-Math.random() * 20) + "s";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
